server:
  port: 8081
  # En producción el HTTPS lo termina el proxy (nginx u otro) delante de este backend, que
  # recibe la petición ya en HTTP plano — sin esto, Spring arma la redirect_uri de Google
  # con "http://" en vez de "https://" (no coincide con lo registrado en Google Cloud
  # Console → "Error 400: redirect_uri_mismatch"). Necesita que el proxy mande
  # X-Forwarded-Proto/Host — si no los manda, hay que agregarlos ahí primero.
  forward-headers-strategy: framework
  tomcat:
    max-part-count: 50

spring:
  application:
    name: vendy

  datasource:
    url: jdbc:mysql://vps-5943657-x.dattaweb.com:3306/zavefy_sass_db?allowPublicKeyRetrieval=true
    username: root
    password: 21josesamuel03
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 540000
      keepalive-time: 300000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    generate-ddl: false
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 100

    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            # Se completan con las credenciales reales de Google Cloud Console vía
            # variables de entorno — nunca hardcodeadas acá. Con el placeholder de abajo
            # el resto del backend sigue arrancando normal aunque todavía no estén
            # configuradas; "Continuar con Google" simplemente no va a funcionar hasta
            # que GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET existan en el entorno.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

security:
  jwt:
    key:
      private: mi_clave_super_secreta_123456
    user:
      generator: vendy-app
    expiration: 28800000

yolo:
